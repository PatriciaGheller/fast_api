[project]
name = "dio-blog"
version = "0.1.0"
description = ""
authors = [
    { name = "Patrícia Gheller", email = "patricia.gheller.1985@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard] (>=0.48.0,<0.49.0)",
    "databases[aiosqlite,asyncpg]",
    "pyjwt",
    "pytest",
    "pytest-asyncio",
    "httpx",
    "pytest-mock",
    "psycopg2-binary",
    "pydantic-settings (>=2.14.1,<3.0.0)"   
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
  { include = "src" }
]
